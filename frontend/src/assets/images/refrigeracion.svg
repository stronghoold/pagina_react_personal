<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cooler" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="170" cy="100" r="120" fill="#22d3ee" opacity="0.1"/>
  <circle cx="640" cy="360" r="130" fill="#818cf8" opacity="0.12"/>
  <!-- Base del disipador -->
  <rect x="280" y="200" width="240" height="40" rx="10" fill="#475569"/>
  <!-- Aletas -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="2">
    <rect x="230" y="100" width="340" height="16" rx="5"/>
    <rect x="230" y="124" width="340" height="16" rx="5"/>
    <rect x="230" y="148" width="340" height="16" rx="5"/>
    <rect x="230" y="172" width="340" height="16" rx="5"/>
  </g>
  <!-- Heatpipes -->
  <g stroke="#fbbf24" stroke-width="6" fill="none" opacity="0.85">
    <path d="M250 96 L250 240"/>
    <path d="M400 96 L400 240"/>
    <path d="M550 96 L550 240"/>
  </g>
  <!-- Fane -->
  <circle cx="400" cy="150" r="52" fill="#0b1220" stroke="#334155" stroke-width="3"/>
  <circle cx="400" cy="150" r="18" fill="#22d3ee" opacity="0.85"/>
  <g fill="#475569">
    <path d="M400 101 A49 49 0 0 1 444 128 L415 150 Z"/>
    <path d="M400 199 A49 49 0 0 1 356 172 L385 150 Z"/>
    <path d="M354 115 A49 49 0 0 1 400 101 L400 132 Z"/>
    <path d="M446 185 A49 49 0 0 1 400 199 L400 168 Z"/>
  </g>
  <!-- Soportes de montaje -->
  <rect x="230" y="262" width="18" height="40" rx="5" fill="#334155"/>
  <rect x="552" y="262" width="18" height="40" rx="5" fill="#334155"/>
  <!-- Tornillos -->
  <circle cx="239" cy="270" r="5" fill="#94a3b8"/>
  <circle cx="561" cy="270" r="5" fill="#94a3b8"/>
  <text x="400" y="425" fill="#94a3b8" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">REFRIGERACIÓN LIQUIDA AIO</text>
</svg>
