  <line x1="175" y1="220" x2="625" y2="220" stroke="#1e293b" stroke-width="2"/>
  <line x1="300" y1="95" x2="300" y2="325" stroke="#1e293b" stroke-width="2"/>
  <line x1="450" y1="95" x2="450" y2="325" stroke="#1e293b" stroke-width="2"/>
