    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="200" cy="100" r="120" fill="#818cf8" opacity="0.12"/>
  <circle cx="620" cy="360" r="130" fill="#22d3ee" opacity="0.1"/>
  <!-- Pantalla -->
  <rect x="150" y="70" width="500" height="280" rx="18" fill="url(#screen)" stroke="#334155" stroke-width="4"/>
