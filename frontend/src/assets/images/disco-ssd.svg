<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ssd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="180" cy="100" r="120" fill="#818cf8" opacity="0.12"/>
  <circle cx="620" cy="360" r="130" fill="#22d3ee" opacity="0.1"/>
  <!-- Cuerpo -->
  <rect x="200" y="120" width="400" height="220" rx="20" fill="url(#ssd)" stroke="#334155" stroke-width="3"/>
  <rect x="224" y="144" width="352" height="172" rx="12" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- Chip controlador -->
  <rect x="360" y="190" width="80" height="80" rx="10" fill="#312e81"/>
  <rect x="372" y="202" width="56" height="56" rx="6" fill="#4f46e5" opacity="0.7"/>
  <!-- Chips NAND -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="2">
    <rect x="250" y="200" width="70" height="30" rx="6"/><rect x="250" y="245" width="70" height="30" rx="6"/>
    <rect x="480" y="200" width="70" height="30" rx="6"/><rect x="480" y="245" width="70" height="30" rx="6"/>
  </g>
  <!-- Conector -->
  <rect x="200" y="315" width="70" height="25" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <!-- Led -->
  <circle cx="560" cy="165" r="7" fill="#22d3ee"/>
  <text x="400" y="425" fill="#94a3b8" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">DISCO SSD NVMe</text>
</svg>
